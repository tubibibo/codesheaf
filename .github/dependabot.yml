version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # These require Node >= 22; the project keeps a Node 20 baseline.
      - dependency-name: vitest
        versions: ['5.x']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['5.x']
      - dependency-name: '@vscode/vsce'
        versions: ['4.x']
      # Node 26 types would typecheck against APIs the Node 20 baseline lacks;
      # vitest 4 also peers on ^20.19 || ^22.12 || >=24.
      - dependency-name: '@types/node'
        versions: ['25.x', '26.x']
      # Must track engines.vscode (^1.96.0): newer typings would let the code
      # call APIs that do not exist in the oldest host we claim to support.
      - dependency-name: '@types/vscode'
        versions: ['>=1.97.0']
      # TS 7 breaks typescript-eslint 8 (ERESOLVE); revisit when the peer
      # range widens.
      - dependency-name: typescript
        versions: ['7.x']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
        exclude:
          # Keep the matrix at three jobs: cross-platform coverage on the
          # current LTS, plus the older LTS on Linux.
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (src + tests)
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Compile
        run: npm run compile

      - name: Headless adapter assembly smoke (vscode stub)
        run: npm run test:smoke

      - name: Package extension
        run: npx vsce package

      - name: Upload .vsix artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: codesheaf-vsix
          path: '*.vsix'
